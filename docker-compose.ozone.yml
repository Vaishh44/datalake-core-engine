version: "3.8"
services:
  ozone-scm:
    image: apache/ozone:1.3.0
    container_name: ozone-scm
    command: [ "ozone", "scm" ]
    ports:
      - "9876:9876"
    # SCM does not need to know its own name via env var in this mode
    networks: [ ozone-net ]

  ozone-om:
    image: apache/ozone:1.3.0
    container_name: ozone-om
    command: [ "ozone", "om" ]
    ports:
      - "9878:9878"
    environment:
      OZONE_SCM_NAMES: ozone-scm
      OZONE_OM_ADDRESS: ozone-om
    depends_on: [ ozone-scm ]
    networks: [ ozone-net ]

  ozone-datanode:
    image: apache/ozone:1.3.0
    container_name: ozone-datanode
    command: [ "ozone", "datanode" ]
    environment:
      OZONE_SCM_NAMES: ozone-scm
      OZONE_OM_ADDRESS: ozone-om
    depends_on: [ ozone-scm ]
    networks: [ ozone-net ]

  ozone-s3g:
    image: apache/ozone:1.3.0
    container_name: ozone-s3g
    command: [ "ozone", "s3g" ]
    ports:
      - "9862:9862"
    environment:
      OZONE_SCM_NAMES: ozone-scm
      OZONE_OM_ADDRESS: ozone-om
    depends_on: [ ozone-om ]
    networks: [ ozone-net ]

networks:
  ozone-net:
    driver: bridge
