version: "3.8"

services:
  ozone-all-in-one:
    image: apache/ozone:1.3.0
    container_name: ozone-all-in-one
    hostname: ozone-all-in-one
    ports:
      - "9874:9874" # OM UI
      - "9862:9862" # S3 Gateway
    environment:
      OZONE_OM_ADDRESS: 0.0.0.0
      OZONE_OM_HTTP_BIND_HOST: 0.0.0.0
      OZONE_S3G_HTTP_BIND_HOST: 0.0.0.0

      OZONE_SCM_NAMES: localhost
      OZONE_SCM_CLIENT_BIND_HOST: 0.0.0.0
      OZONE_SCM_BLOCK_CLIENT_BIND_HOST: 0.0.0.0
      OZONE_SCM_DATANODE_ID: localhost
      OZONE_DATANODE_ADDRESS: localhost

      OZONE_REPLICATION: 1
      OZONE_METADATA_DIRS: /data/metadata
    volumes:
      - ./ozone-data:/data
    command:
      - "/bin/bash"
      - "-c"
      - |
        echo "------------------------------------------------"
        echo "   OZONE ALL-IN-ONE STARTUP SCRIPT              "
        echo "------------------------------------------------"

        # 1. Initialize SCM if needed
        if [ ! -f /data/metadata/scm/current/VERSION ]; then
           echo "[INIT] Initializing SCM..."
           ozone scm --init
        else
           echo "[INIT] SCM already initialized."
        fi

        # 2. Initialize OM if needed
        if [ ! -f /data/metadata/om/current/VERSION ]; then
           echo "[INIT] Initializing OM..."
           ozone om --init
        else
           echo "[INIT] OM already initialized."
        fi

        # 3. Start Core Services
        echo "[START] Starting SCM..."
        ozone scm --daemon start

        echo "[START] Starting OM..."
        ozone om --daemon start

        echo "[START] Starting Datanode..."
        ozone datanode --daemon start

        # 4. Wait for OM to be Ready
        echo "[WAIT] Waiting for Ozone Manager..."
        until ozone sh volume list / > /dev/null 2>&1; do
          echo "   ... waiting for OM ..."
          sleep 5
        done
        echo "[READY] OM is online!"



        # 6. Start S3 Gateway
        echo "[START] Starting S3 Gateway..."
        ozone s3g --daemon start

        # 7. Keep Alive
        echo "[DONE] All services started. Keeping container alive."
        tail -f /dev/null
