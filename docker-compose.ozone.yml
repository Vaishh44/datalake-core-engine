version: "3.8"

services:
  ozone-all-in-one:
    image: apache/ozone:1.3.0
    container_name: ozone-all-in-one
    hostname: ozone-all-in-one
    ports:
      - "9874:9874" # OM UI
    environment:
      # Network Binding
      OZONE_OM_ADDRESS: 0.0.0.0
      OZONE_OM_HTTP_BIND_HOST: 0.0.0.0

      # Internal Discovery
      OZONE_SCM_NAMES: localhost
      OZONE_SCM_CLIENT_BIND_HOST: 0.0.0.0
      OZONE_SCM_BLOCK_CLIENT_BIND_HOST: 0.0.0.0
      OZONE_SCM_DATANODE_ID: localhost
      OZONE_DATANODE_ADDRESS: localhost

      # Config
      OZONE_METADATA_DIRS: /data/metadata

      # ⚠️ STRICT SINGLE NODE REPLICATION
      OZONE_REPLICATION: "1"
      OZONE_SCM_REPLICATION_FACTOR: "1"
      OZONE_SCM_PIPELINE_OWNER_CONTAINER_COUNT: "1"
      OZONE_SCM_CONTAINER_PLACEMENT_IMPL: org.apache.hadoop.hdds.scm.container.placement.algorithms.SimpleContainerPlacementPolicy
    volumes:
      - ./ozone-data:/data
    command:
      - "/bin/bash"
      - "-c"
      - |
        echo "------------------------------------------------"
        echo "   OZONE NATIVE STORAGE STARTUP                 "
        echo "------------------------------------------------"

        # 1. Initialize SCM configuration
        if [ ! -f /data/metadata/scm/current/VERSION ]; then
           echo "[INIT] Initializing SCM..."
           ozone scm --init
        else
           echo "[INIT] SCM already initialized."
        fi

        # 2. Initialize OM configuration
        if [ ! -f /data/metadata/om/current/VERSION ]; then
           echo "[INIT] Initializing OM..."
           ozone om --init
        else
           echo "[INIT] OM already initialized."
        fi

        echo "------------------------------------------------"
        echo "   STARTING CORE DAEMONS ONLY                   "
        echo "------------------------------------------------"

        # 3. Start SCM
        echo "[START] Storage Container Manager..."
        ozone --daemon start scm
        sleep 10

        # 4. Start OM
        echo "[START] Ozone Manager..."
        ozone --daemon start om
        sleep 10

        # 5. Start Datanode
        echo "[START] Datanode..."
        ozone --daemon start datanode
        sleep 10

        # Note: S3 Gateway is explicitly NOT started for this phase.

        # 6. Verification inside container
        echo "------------------------------------------------"
        echo "   RUNNING PROCESSES (JPS)                      "
        echo "------------------------------------------------"
        jps

        echo "------------------------------------------------"
        echo "   CONTAINER READY - KEEPING ALIVE              "
        echo "------------------------------------------------"
        tail -f /dev/null
