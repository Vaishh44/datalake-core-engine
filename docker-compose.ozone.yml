version: "3.8"

services:
  ozone-all-in-one:
    image: apache/ozone:1.3.0
    container_name: ozone-all-in-one
    hostname: ozone-all-in-one

    ports:
      - "9874:9874" # OM UI
      - "9862:9862" # S3 Gateway

    environment:
      # Core addresses (WITH ports)
      OZONE_SCM_NAMES: ozone-all-in-one
      OZONE_SCM_ADDRESS: ozone-all-in-one:9860
      OZONE_SCM_CLIENT_ADDRESS: ozone-all-in-one:9860

      OZONE_OM_ADDRESS: ozone-all-in-one:9862
      OZONE_OM_HTTP_BIND_HOST: 0.0.0.0

      OZONE_DATANODE_ADDRESS: ozone-all-in-one:9864
      OZONE_SCM_DATANODE_ID: ozone-all-in-one

      # Single-node replication
      OZONE_REPLICATION: "1"
      OZONE_SCM_REPLICATION_FACTOR: "1"

      # Metadata
      OZONE_METADATA_DIRS: /data/metadata

    volumes:
      - ./ozone-data:/data
      - ./entrypoint.sh:/entrypoint.sh

    entrypoint: [ "/bin/bash", "/entrypoint.sh" ]
